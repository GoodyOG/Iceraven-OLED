name: Build IceRaven Dark Theme (Auto-Release)

on:
  schedule:
    - cron: '00 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest release info from this repo
        id: this_repo_latest_release
        uses: cardinalby/git-get-release-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          latest: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zipalign apksigner jq

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get latest upstream ARM64 release
        id: get_upstream_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/fork-maintainers/iceraven-browser/releases/latest \
            -o upstream-release.json
          url=$(jq -er '[.assets[] | select(.name | endswith("arm64-v8a.apk")) | .browser_download_url] | first' upstream-release.json)
          version=$(jq -er '.tag_name | sub("^iceraven-"; "")' upstream-release.json)
          echo "LATEST_RELEASE=$url" >> "$GITHUB_OUTPUT"
          echo "ICERAVEN_VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "Current upstream IceRaven version: $version"

      - name: Check if new version is available
        id: version_check
        env:
          UPSTREAM_VERSION: ${{ steps.get_upstream_release.outputs.ICERAVEN_VERSION }}
          THIS_REPO_VERSION: ${{ steps.this_repo_latest_release.outputs.tag_name }}
        run: |
          if [ "$UPSTREAM_VERSION" != "$THIS_REPO_VERSION" ]; then
            echo 'NEW_VERSION_AVAILABLE=true' >> "$GITHUB_OUTPUT"
            echo 'New version available; building and releasing.'
          else
            echo 'NEW_VERSION_AVAILABLE=false' >> "$GITHUB_OUTPUT"
            echo 'No new version from upstream.'
          fi

      - name: Download latest APK
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        env:
          APK_URL: ${{ steps.get_upstream_release.outputs.LATEST_RELEASE }}
        run: curl --fail --location --retry 3 "$APK_URL" -o iceraven.apk

      - name: Run build script
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        run: bash build.sh

      - name: Sign APK
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > keystore.jks
          apksigner sign --ks keystore.jks --ks-pass env:KEYSTORE_PASSPHRASE --key-pass env:KEY_PASSWORD iceraven-patched-signed.apk
          apksigner verify --verbose iceraven-patched-signed.apk

      - name: Upload APK as artifact
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-dark-apk
          path: iceraven-patched-signed.apk

      - name: Create release
        if: steps.version_check.outputs.NEW_VERSION_AVAILABLE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_upstream_release.outputs.ICERAVEN_VERSION }}
          name: IceRaven Dark Theme ${{ steps.get_upstream_release.outputs.ICERAVEN_VERSION }}
          body: |
            Automatic release of IceRaven Dark Theme based on upstream version ${{ steps.get_upstream_release.outputs.ICERAVEN_VERSION }}.

            This APK is automatically built and patched for a dark theme.
          files: iceraven-patched-signed.apk

